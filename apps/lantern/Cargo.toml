[package]
name = "lantern"
description = "Lantern's runner: opens a window and runs a game written in Nyx (games/<name>/)"
edition = "2024"
version.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["bundled-sdl"]
bundled-sdl = ["lantern-game-host/bundled-sdl"]
system-sdl = ["lantern-game-host/system-sdl"]

[dependencies]
lantern-core.workspace = true
lantern-game-host.workspace = true
log.workspace = true

[lints]
workspace = true
