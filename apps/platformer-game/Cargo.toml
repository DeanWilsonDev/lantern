[package]
name = "platformer-game"
description = "Lantern's demo: a small third-person platformer with Nyx-scripted rules"
edition = "2024"
version.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["bundled-sdl", "nyx-scripting"]
# Game rules in Nyx (scripts/platformer.nyx). Building Nyx needs CMake 3.30+ and GCC 14 or
# Clang 19, and a nyx-scripting-language checkout beside this repository (see the README).
# Without the feature the game uses the same rules in Rust (src/rules.rs).
nyx-scripting = ["dep:lantern-scripting"]
bundled-sdl = ["lantern-sdl-facade/bundled-sdl", "lantern-sdl-gpu/bundled-sdl"]
system-sdl = ["lantern-sdl-facade/system-sdl", "lantern-sdl-gpu/system-sdl"]

[dependencies]
lantern-core.workspace = true
lantern-platform.workspace = true
lantern-sdl-facade.workspace = true
lantern-engine.workspace = true
lantern-renderer-3d.workspace = true
lantern-sdl-gpu.workspace = true
lantern-audio.workspace = true
lantern-physics.workspace = true
lantern-debug.workspace = true
lantern-scripting = { workspace = true, optional = true }
glam.workspace = true
log.workspace = true

[lints]
workspace = true
