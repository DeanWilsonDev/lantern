[workspace]
resolver = "2"
members = [
    "crates/nyx-sys",
    "crates/nyx",
    "crates/core",
    "crates/platform",
    "crates/sdl-facade",
    "crates/renderer-3d",
    "crates/sdl-gpu",
    "crates/physics",
    "crates/audio",
    "crates/scripting",
    "crates/debug",
    "crates/engine",
    "apps/platformer-game",
    "examples/frame-loop",
    "tools/asset-gen",
]
default-members = [
    "crates/core",
    "crates/platform",
    "crates/sdl-facade",
    "crates/renderer-3d",
    "crates/sdl-gpu",
    "crates/physics",
    "crates/audio",
    "crates/scripting",
    "crates/debug",
    "crates/engine",
    "apps/platformer-game",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Dean Wilson"]
rust-version = "1.87"

[workspace.dependencies]
lantern-core = { path = "crates/core" }
lantern-platform = { path = "crates/platform" }
lantern-sdl-facade = { path = "crates/sdl-facade", default-features = false }
lantern-renderer-3d = { path = "crates/renderer-3d" }
lantern-sdl-gpu = { path = "crates/sdl-gpu" }
lantern-physics = { path = "crates/physics" }
lantern-audio = { path = "crates/audio" }
lantern-scripting = { path = "crates/scripting" }
lantern-debug = { path = "crates/debug" }
lantern-engine = { path = "crates/engine" }
nyx = { path = "crates/nyx" }
glam = "0.30.10"
log = "0.4.28"
png = "0.18"
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
sdl3-sys = { version = "0.7.2", default-features = false }
naga = { version = "30", features = ["wgsl-in", "spv-out", "msl-out"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.dev.package."*"]
# Dependencies (SDL, naga, gltf) are optimised even in debug builds so the demo runs smoothly
# while our own crates keep fast compiles and full debug info.
opt-level = 2
