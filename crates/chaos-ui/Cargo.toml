[package]
name = "lantern-chaos-ui"
description = "The in-game UI in Chaos components and Cosmos stylesheets: a C++ bridge that runs them on the game's Nyx runtime behind Umbra::IWidget, and the Rust layout, drawing and menu focus over it"
edition = "2024"
version.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
lantern-core.workspace = true
lantern-renderer-3d.workspace = true
nyx.workspace = true
# The bridge is built and linked by nyx-sys's build script, in the same CMake build as Nyx.
nyx-sys = { workspace = true, features = ["chaos-ui"] }
glam.workspace = true

[lints]
workspace = true
