[package]
name = "lantern-sdl-gpu"
description = "Lantern's SDL GPU backend: device, shaders, pipelines, buffers, textures and frame submission"
edition = "2024"
version.workspace = true
authors.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = ["bundled-sdl"]
bundled-sdl = ["lantern-sdl-facade/bundled-sdl"]
system-sdl = ["lantern-sdl-facade/system-sdl"]

[dependencies]
lantern-core.workspace = true
lantern-renderer-3d.workspace = true
lantern-sdl-facade.workspace = true
glam.workspace = true
log.workspace = true
sdl3-sys.workspace = true

[build-dependencies]
naga.workspace = true

[lints]
workspace = true

[dev-dependencies]
lantern-platform.workspace = true
