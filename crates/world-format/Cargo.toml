[package]
name = "lantern-world-format"
description = "Lantern's world file: the serde data types, loading and saving, and turning a world into mesh and collision pieces. Shared by the game host and the world editor."
edition = "2024"
version.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
lantern-core.workspace = true
lantern-renderer-3d.workspace = true
lantern-physics.workspace = true
glam.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true
