[package]
name = "lantern-editor-backend"
description = "The world editor's Rust backend: an EditorSession plus an off-screen GPU viewport, behind a C API the editor's front end links"
edition = "2024"
version.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
# `staticlib` for the C++ editor shell; `rlib` for Rust tests and tools.
crate-type = ["staticlib", "rlib"]

[features]
# The editor shares one SDL with its UI toolkit (Penumbra links the system SDL3), so the
# backend links the system SDL too. Linking a second, bundled SDL into the same process would
# give two copies of SDL's global state.
default = ["system-sdl"]
system-sdl = ["lantern-sdl-gpu/system-sdl"]
bundled-sdl = ["lantern-sdl-gpu/bundled-sdl"]

[dependencies]
lantern-core.workspace = true
lantern-renderer-3d.workspace = true
lantern-sdl-gpu.workspace = true
lantern-world-format.workspace = true
lantern-editor-core.workspace = true
glam.workspace = true
log.workspace = true

[lints]
workspace = true
