[package]
name = "lantern-sdl-facade"
description = "SDL3 adapters for Lantern: context, window, events, gamepad and audio output"
edition = "2024"
version.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["bundled-sdl"]
# Build SDL 3 from source with CMake and link it statically (decision D-003).
bundled-sdl = ["sdl3-sys/build-from-source-static"]
# Link an SDL 3 found by pkg-config (for example Arch's `sdl3` package).
system-sdl = ["sdl3-sys/use-pkg-config"]

[dependencies]
lantern-core.workspace = true
lantern-platform.workspace = true
log.workspace = true
sdl3-sys.workspace = true

[lints]
workspace = true
