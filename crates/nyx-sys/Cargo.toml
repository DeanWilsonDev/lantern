[package]
name = "nyx-sys"
description = "Raw bindings to nyx-capi, the C API of the Nyx scripting language prototype"
edition.workspace = true
version.workspace = true
authors.workspace = true
rust-version.workspace = true
links = "nyx-capi"
build = "build.rs"

[features]
# Also build Chaos, Cosmos and Lantern's Chaos bridge (crates/chaos-ui/native) in the same CMake
# build as Nyx, and link them. lantern-chaos-ui turns this on.
chaos-ui = []

[build-dependencies]
bindgen = "0.72"
cmake = "0.1"
