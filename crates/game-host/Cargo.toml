[package]
name = "lantern-game-host"
description = "Runs a game written in Nyx: owns the engine (world, renderer, physics, audio, UI) and exposes it to the game's scripts. The seam between engine code (Rust) and game code (Nyx)."
edition = "2024"
version.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["bundled-sdl"]
bundled-sdl = ["lantern-sdl-facade/bundled-sdl", "lantern-sdl-gpu/bundled-sdl"]
system-sdl = ["lantern-sdl-facade/system-sdl", "lantern-sdl-gpu/system-sdl"]

[dependencies]
lantern-core.workspace = true
lantern-platform.workspace = true
lantern-sdl-facade.workspace = true
lantern-sdl-gpu.workspace = true
lantern-renderer-3d.workspace = true
lantern-physics.workspace = true
lantern-audio.workspace = true
lantern-debug.workspace = true
lantern-engine.workspace = true
lantern-world-format.workspace = true
nyx.workspace = true
glam.workspace = true
log.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
